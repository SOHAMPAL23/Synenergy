version: "3.9"

# EnerVision AI - Development Override
# Usage: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# This file overrides production settings for local development:
#   - Hot-reload for FastAPI backend (--reload)
#   - Volume-mounts source code for live changes
#   - Exposes ports directly (no nginx required)
#   - DEBUG mode enabled

services:

  api:
    build:
      target: builder   # Use builder stage (has gcc, etc.)
    container_name: enervision-api-dev
    command: >
      uvicorn backend.main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --reload-dir backend
      --reload-dir ml
      --log-level debug
    ports:
      - "8001:8000"   # Expose directly in dev (mapped to 8001 to avoid conflicts)
    volumes:
      - .:/app        # Mount entire project for hot-reload
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_URL_SYNC=${DATABASE_URL_SYNC}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-not-for-production}
      - ALLOWED_ORIGINS=["http://localhost:3000","http://localhost:5173","http://localhost:8080"]
    dns:
      - 8.8.8.8
      - 1.1.1.1

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: builder   # Node.js stage only
    container_name: enervision-frontend-dev
    command: npm run dev -- --host 0.0.0.0 --port 5173
    ports:
      - "5173:5173"   # Vite dev server
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    environment:
      - VITE_API_URL=http://localhost:8001/api/v1
    depends_on:
      - api
    healthcheck:
      disable: true

  # ── Disable nginx in dev (direct port access) ──────────────────────────────
  nginx:
    profiles:
      - production   # Only start nginx in production profile
