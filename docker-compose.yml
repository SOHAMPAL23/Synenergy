version: "3.9"

# EnerVision AI - Production Docker Compose
# Services: FastAPI backend + React frontend + Nginx reverse proxy
#
# Usage:
#   Production:  docker-compose up -d --build
#   Development: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up

services:

  # ── FastAPI Backend ──────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: enervision-api
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_URL_SYNC=${DATABASE_URL_SYNC}
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=false
      - ALLOWED_ORIGINS=["https://${DOMAIN:-localhost}","http://localhost"]
      - RATE_LIMIT_REQUESTS=${RATE_LIMIT_REQUESTS:-100}
      - RATE_LIMIT_WINDOW_SECONDS=${RATE_LIMIT_WINDOW_SECONDS:-60}
      - MAX_UPLOAD_SIZE_MB=${MAX_UPLOAD_SIZE_MB:-50}
    volumes:
      - uploads_data:/app/uploads
      - ml_outputs:/app/ml/outputs
      - data_readonly:/app/data:ro
    expose:
      - "8000"
    networks:
      - enervision-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ── React Frontend (built → Nginx SPA server) ────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: enervision-frontend
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - enervision-net
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # ── Nginx Reverse Proxy ──────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: enervision-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # SSL certificates (populated by Certbot on EC2)
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/lib/letsencrypt:/var/lib/letsencrypt:ro
      # Error page
      - nginx_html:/usr/share/nginx/html
    networks:
      - enervision-net
    depends_on:
      - api
      - frontend
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 60s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

# ── Networks ───────────────────────────────────────────────────────────────────
networks:
  enervision-net:
    name: enervision-network
    driver: bridge

# ── Volumes ────────────────────────────────────────────────────────────────────
volumes:
  uploads_data:
    name: enervision-uploads
  ml_outputs:
    name: enervision-ml-outputs
  data_readonly:
    name: enervision-data
  nginx_html:
    name: enervision-nginx-html
