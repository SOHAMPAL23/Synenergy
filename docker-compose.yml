version: "3.9"

services:
  # ── FastAPI Backend ────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: enervision-api
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_URL_SYNC=${DATABASE_URL_SYNC}
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=false
      - ALLOWED_ORIGINS=["http://localhost:3000","http://localhost:5173"]
    volumes:
      - ./uploads:/app/uploads
      - ./ml/outputs:/app/ml/outputs
      - ./data:/app/data:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── Development override (uncomment for local dev) ─────────────────────────
  # api-dev:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
  #   volumes:
  #     - .:/app
  #   ports:
  #     - "8000:8000"
  #   environment:
  #     - ENVIRONMENT=development
  #     - DEBUG=true

networks:
  default:
    name: enervision-network
